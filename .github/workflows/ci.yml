name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows natively (CPU JAX; GPUs go through WSL2, which is the Linux job),
        # and macOS, where JAX also trains on the CPU.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # `uv run` re-syncs the default groups (dev + the multi-GB JAX `stack`)
      # before every command unless told not to; the environment is the one
      # `uv sync` below made, and nothing else.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags since v8: pinned to its release
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      # The fast suite needs no JAX: skip the multi-GB CUDA stack group.
      - run: uv sync --no-default-groups --group dev
      - name: the JAX stack stayed out
        run: uv run python -c "import importlib.util as u; assert u.find_spec('jax') is None"
      - run: uv run ruff check .
      - run: uv run pytest tests/ -q
      - name: the installer script parses
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - name: the Windows installer script parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
