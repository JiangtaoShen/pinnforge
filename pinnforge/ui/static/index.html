<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PINNForge</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" id="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 C 8 6, 12 6, 14 12 S 18 18, 20 6"/><circle cx="20" cy="6" r="2.2"/></svg>
    <span>PINNForge</span>
    <span class="ws" id="ws-name"></span>
  </a>
  <nav class="crumbs" id="crumbs" aria-label="breadcrumb"></nav>
  <div class="top-actions">
    <span class="conn" id="conn" aria-live="polite"></span>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="theme">◐</button>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<noscript>The PINNForge dashboard needs JavaScript.</noscript>
</body>
</html>
