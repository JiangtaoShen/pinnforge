[project]
name = "pinnforge"
version = "0.2.0"
description = "PINNForge — knowledge-centric multi-agent system for autonomous PINN design"
# Below 3.14: the pinned numpy (2.1.1, shared with the stack) has no wheels for it.
requires-python = ">=3.11,<3.14"
dependencies = [
    # ── Orchestrator (harness-agnostic; no LLM SDK — agents are external CLIs) ──
    # Deliberately light: this is what `uv tool install` (install.sh, from
    # GitHub — the PyPI name `pinnforge` is an unrelated project) installs.
    # The JAX stack belongs to each workspace's own environment, pinned in
    # pinnforge/templates/stack.toml and written there by `pinnforge init`.
    "pyyaml>=6.0",
    # The score service computes rRMSE in this process; pinned to the
    # stack's numpy so a score is the same number whichever side computes it.
    "numpy==2.1.1",
]

[project.scripts]
pinnforge = "pinnforge.cli:main"

# The development environment of this checkout: the same frozen stack a
# workspace gets (pinnforge/templates/stack.toml — tests/test_workspace.py
# keeps them equal), installed by a plain `uv sync`.
[dependency-groups]
# ruff is bounded, not floored: its default rule set widens between minor
# releases, and an unbounded floor is how `ruff check .` went from clean to 71
# findings without a line of this repo changing.
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]
# JAX publishes CUDA wheels for Linux only; elsewhere the checkout gets the
# CPU build, as `pinnforge init` gives a workspace there.
stack = [
    "jax[cuda12]==0.4.33; sys_platform == 'linux'",
    "jax==0.4.33; sys_platform != 'linux'",
    "flax==0.9.0",
    "optax==0.2.3",
    "numpy==2.1.1",
    "scipy==1.17.1",
    "jaxopt==0.8.5",
    "evosax==0.1.6",
    "ml_collections==1.1.0",
    "jaxtyping==0.3.11",
    "chex>=0.1.86",
    "soap-jax @ git+https://github.com/haydn-jones/SOAP_JAX@ddddc25724dfd629b0cd01584eca1e32ea8ac4de",
]

[tool.uv]
default-groups = ["dev", "stack"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pinnforge"]
# A local quarantine copy of the corpus is never part of the package.
exclude = ["pinnforge/_QUARANTINE*"]

# The harness plugin ships inside the wheel too, so `pinnforge chat` can load
# it with no separate install.
[tool.hatch.build.targets.wheel.force-include]
"plugin" = "pinnforge/_plugin"

[tool.hatch.build.targets.sdist]
exclude = ["/tasks", "/runs", "/logs", "/.pinnforge", "pinnforge/_QUARANTINE*"]

# soap-jax is pinned to a git commit, like the framework it came from.
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
# `tasks/` is data, not framework code. Its `baseline.py` and `eval.py` are
# md5-fingerprinted by the anchor cache (pinnforge/task/registry.py), so a
# whitespace-only lint fix marks every cached b00 STALE and costs a GPU
# re-measurement of a number that is not reproducible to better than 0.4-17%.
# They are held to the task contract instead: `pinnforge task validate`.
extend-exclude = ["tasks", "pinnforge/examples"]

[tool.ruff.lint]
# Selected explicitly, never inherited. Ruff's default set widened between
# releases and silently turned a passing gate into 71 findings under the same
# `ruff>=0.6` floor — a lint contract that moves on its own is not a contract.
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RET", "RUF"]
# The prose in this repo — docstrings, charter, corpus — uses real typography:
# em dashes, en dashes in ranges, × in "3×". Flagging those as ambiguous would
# make the linter an argument with the house style rather than a check on it.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` tests run real evaluations (JAX, a GPU, the private references);
# `uv run pytest -m slow` runs them.
addopts = "-m 'not slow'"
markers = ["slow: runs real evaluations — needs the JAX environment, a GPU and private/"]
